# Reusable workflow to build/push a service image and bump its tag in the
# gitops repo. Does NOT deploy or touch a cluster - Argo CD reconciles the
# gitops repo after this workflow commits to it. Called from
# mini-sector/<repo>/.github/workflows/*.yml via
# `uses: mini-sector/.github/.github/workflows/docker-build.yml@main`.
name: docker-build

on:
  workflow_call:
    inputs:
      service:
        description: Crate/service name; also used as the image name
        type: string
        required: true
      dockerfile:
        description: Path to the Dockerfile
        type: string
        default: Dockerfile
      context:
        description: Docker build context
        type: string
        default: "."
      registry:
        description: Container registry to push to
        type: string
        default: ghcr.io
      gitops-repo:
        description: Repo containing the Kustomize overlays, e.g. mini-sector/gitops
        type: string
        required: true
      gitops-path:
        description: Directory containing the Kustomize overlay to update
        type: string
        required: true
      build-args:
        type: string
        default: ""
        description: Newline-separated KEY=value pairs passed to docker build
      run-number:
        type: string
        required: true
        description: Caller's github.run_number for image tag
      skip-gitops:
        type: boolean
        default: false
        description: Skip the gitops update job (caller handles it)
    secrets:
      gitops-app-id:
        description: GitHub App ID for gitops repo access
        required: true
      gitops-app-private-key:
        description: GitHub App private key for gitops repo access
        required: true
      azure-client-id:
        description: Azure AD application (client) ID, for non-ghcr (ACR) registries
        required: false
      azure-tenant-id:
        description: Azure AD tenant ID, for non-ghcr (ACR) registries
        required: false
      azure-subscription-id:
        description: Azure subscription ID, for non-ghcr (ACR) registries
        required: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-tag: ${{ steps.tags.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry (GHCR)
        if: ${{ inputs.registry == 'ghcr.io' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure login (OIDC)
        if: ${{ inputs.registry != 'ghcr.io' }}
        uses: mini-sector/.github/actions/azure-login@main
        with:
          client-id: ${{ secrets.azure-client-id }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          subscription-id: ${{ secrets.azure-subscription-id }}

      - name: Log in to registry (ACR)
        if: ${{ inputs.registry != 'ghcr.io' }}
        shell: bash
        run: az acr login --name "$(cut -d. -f1 <<< '${{ inputs.registry }}')"

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "image-tag=${{ inputs.run-number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ inputs.registry }}/mini-sector/${{ inputs.service }}:${{ steps.tags.outputs.image-tag }}
            ${{ inputs.registry }}/mini-sector/${{ inputs.service }}:latest
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    needs: build-push
    if: ${{ github.event_name != 'pull_request' && !inputs.skip-gitops }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: gitops-update-${{ inputs.gitops-repo }}
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.gitops-app-id }}
          private-key: ${{ secrets.gitops-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: gitops

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops-repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops-checkout

      - name: Check overlay exists
        id: overlay
        shell: bash
        run: |
          if [[ -f "gitops-checkout/${{ inputs.gitops-path }}/kustomization.yaml" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no gitops app for '${{ inputs.service }}' at '${{ inputs.gitops-path }}' — image published, promotion skipped"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kustomize
        if: steps.overlay.outputs.exists == 'true'
        uses: imranismail/setup-kustomize@v2

      - name: Set image tag
        if: steps.overlay.outputs.exists == 'true'
        working-directory: gitops-checkout/${{ inputs.gitops-path }}
        run: kustomize edit set image ${{ inputs.registry }}/mini-sector/${{ inputs.service }}:${{ needs.build-push.outputs.image-tag }}

      - name: Commit and push
        if: steps.overlay.outputs.exists == 'true'
        working-directory: gitops-checkout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          IMAGE_TAG="${{ needs.build-push.outputs.image-tag }}"
          git add "${{ inputs.gitops-path }}"
          if git diff --cached --quiet; then
            echo "::notice::no changes to commit for '${{ inputs.service }}'"
          else
            git commit -m "chore: bump ${{ inputs.service }} to ${IMAGE_TAG}"
            git push
          fi
